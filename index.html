<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A simple typing speed test app built with HTML, CSS, and JavaScript."
    />
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <h1>تست سنجش سرعت تایپ</h1>
    </header>

    <main class="main">
      <section class="intro" aria-labelledby="intro-title">
        <h2 id="intro-title" class="visually-hidden">راهنمای تست</h2>
        <p>
          با شروع تایپ، تایمر فعال می‌شود و در هر لحظه متن واردشده با متن الگو
          مقایسه می‌شود. بعد از کامل شدن متن، نتیجه سرعت و دقت تایپ در جدول ثبت
          خواهد شد.
        </p>
      </section>

      <section class="test-area" aria-labelledby="test-title">
        <h2 id="test-title">Typing Challenge</h2>

        <div class="origin-card">
          <p class="section-label">متن الگو:</p>
          <blockquote id="origin-text">The text to test.</blockquote>
        </div>

        <label class="section-label" for="test-input">متن را اینجا تایپ کنید:</label>
        <div class="test-wrapper" data-state="idle">
          <textarea
            id="test-input"
            name="typing-test"
            rows="6"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="با تایپ اولین حرف، تایمر شروع می‌شود"
          ></textarea>
        </div>

        <div class="meta">
          <output class="timer" aria-live="polite">00:00:00</output>
          <button id="reset" type="button">از نو</button>
        </div>

        <table id="result-table">
          <caption>
            نتایج تست تایپ
          </caption>
          <thead>
            <tr>
              <th scope="col">Round</th>
              <th scope="col">Errors</th>
              <th scope="col">Accuracy</th>
              <th scope="col">WPM</th>
              <th scope="col">WPS</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
